<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007acc" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #4b5563; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #374151; }
    .label-bg { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1px; rx: 4px; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="720" fill="#ffffff" rx="10"/>

  <!-- ================= TOP LEFT: WPF MVVM Layer ================= -->
  <g transform="translate(40, 20)">
    <rect width="360" height="190" fill="#f8fafc" stroke="#007acc" stroke-width="1.8" rx="8" filter="url(#shadow)"/>
    <text x="16" y="24" class="title-box" fill="#007acc">WPF MVVM Layer (via XConfigUtil)</text>

    <!-- ConfigurationControl.xaml -->
    <rect x="25" y="40" width="310" height="52" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" rx="6"/>
    <text x="180" y="62" text-anchor="middle" class="node-title" fill="#1e3a8a">ConfigurationControl.xaml</text>
    <text x="180" y="80" text-anchor="middle" class="node-desc">(WPF Tabbed Preferences Modal Dialog)</text>

    <!-- ConfigurationControlViewModel -->
    <rect x="25" y="118" width="310" height="52" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" rx="6"/>
    <text x="180" y="140" text-anchor="middle" class="node-title" fill="#1e3a8a">ConfigurationControlViewModel</text>
    <text x="180" y="158" text-anchor="middle" class="node-desc">(: BaseViewModel - PropertyChanged Notification)</text>

    <!-- Vertical Arrow inside WPF -->
    <line x1="180" y1="92" x2="180" y2="116" stroke="#007acc" stroke-width="1.5" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  </g>

  <!-- ================= TOP RIGHT: WinForms Layer ================= -->
  <g transform="translate(460, 20)">
    <rect width="380" height="190" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8" rx="8" filter="url(#shadow)"/>
    <text x="16" y="24" class="title-box" fill="#16a34a">WinForms Host Layer (FormMain)</text>

    <!-- Ribbon Controls -->
    <rect x="25" y="55" width="330" height="85" fill="#ffffff" stroke="#86efac" stroke-width="1.2" rx="6"/>
    <text x="190" y="85" text-anchor="middle" class="node-title" fill="#14532d">Top Ribbon Controls (Ribbon UI)</text>
    <text x="190" y="105" text-anchor="middle" class="node-desc">Direct CheckBox / ComboBox / TrackBar Manipulation</text>
    <text x="190" y="123" text-anchor="middle" class="node-desc">(_checkBoxShowAxes, _comboBackground, etc.)</text>
  </g>

  <!-- ================= CENTER: Single Source of Truth (Model) ================= -->
  <g transform="translate(200, 255)">
    <rect width="480" height="165" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="20" y="24" class="title-box" fill="#b45309">Single Source of Truth (Model / SSOT)</text>

    <rect x="20" y="38" width="440" height="110" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2" rx="6"/>
    <text x="240" y="63" text-anchor="middle" class="node-title" fill="#78350f">Configuration (IConfiguration)</text>
    <text x="240" y="86" text-anchor="middle" class="node-desc">• Camera: Zoom, Perspective, ViewProjection</text>
    <text x="240" y="106" text-anchor="middle" class="node-desc">• Display: ShowAxes, ShowFrame, BackgroundColour</text>
    <text x="240" y="130" text-anchor="middle" class="node-desc" font-weight="600" fill="#b45309">⚡ event ConfigurationChangedEventHandler</text>
  </g>

  <!-- ================= BOTTOM: 3D Graphics Engine ================= -->
  <g transform="translate(200, 480)">
    <rect width="480" height="205" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.8" rx="8" filter="url(#shadow)"/>
    <text x="20" y="24" class="title-box" fill="#6d28d9">3D Graphics Engine (XMat3DSolidPlotCtrl)</text>

    <!-- SubCtrl -->
    <rect x="25" y="40" width="430" height="56" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" rx="6"/>
    <text x="240" y="63" text-anchor="middle" class="node-title" fill="#4c1d95">XMat3DSolidPlotCtrlSub</text>
    <text x="240" y="82" text-anchor="middle" class="node-desc">- Subscribes to ConfigurationChangedEventHandler</text>

    <!-- OpenGL Viewport -->
    <rect x="25" y="128" width="430" height="56" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" rx="6"/>
    <text x="240" y="151" text-anchor="middle" class="node-title" fill="#4c1d95">OpenTK OpenGL VBO Renderer</text>
    <text x="240" y="170" text-anchor="middle" class="node-desc">Rebuilds Vertex Buffers &amp; 60 FPS Real-Time Invalidate()</text>

    <!-- Internal Arrow inside 3D Engine -->
    <line x1="240" y1="96" x2="240" y2="126" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
    <rect x="150" y="103" width="180" height="18" class="label-bg"/>
    <text x="240" y="116" text-anchor="middle" class="edge-label" fill="#6d28d9">3. VBO Rebuild &amp; Invalidate()</text>
  </g>

  <!-- ================= CONNECTING EDGES ================= -->

  <!-- 1. WinForms Ribbon -> Model -->
  <path d="M 640 140 L 640 220 L 520 220 L 520 253" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="540" y="195" width="140" height="22" class="label-bg" stroke="#86efac"/>
  <text x="610" y="210" text-anchor="middle" class="edge-label" fill="#15803d">1. Mutates Model via Ribbon</text>

  <!-- 2. WPF ViewModel <-> Model -->
  <path d="M 220 210 L 220 240 L 320 240 L 320 253" fill="none" stroke="#007acc" stroke-width="1.8" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <rect x="180" y="222" width="135" height="20" class="label-bg" stroke="#93c5fd"/>
  <text x="247" y="236" text-anchor="middle" class="edge-label" fill="#007acc">Two-Way Data Binding</text>

  <!-- 3. Model -> WPF ViewModel (Event Notification) -->
  <path d="M 200 330 L 110 330 L 110 212" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="55" y="275" width="110" height="20" class="label-bg"/>
  <text x="110" y="289" text-anchor="middle" class="edge-label" fill="#b45309">Property Notification</text>

  <!-- 4. Model -> 3D Engine (ConfigurationChanged) -->
  <line x1="440" y1="420" x2="440" y2="478" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="440" width="220" height="22" class="label-bg" stroke="#fcd34d"/>
  <text x="440" y="455" text-anchor="middle" class="edge-label" fill="#b45309">2. ConfigurationChanged Event Fired</text>

</svg>
